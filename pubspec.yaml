name: packcheck

description: "LM Inspect - Legal Metrology (Packaged Commodities) Rules, 2011 compliance screening for packaged commodities."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  sqflite: ^2.4.2+1
  path: ^1.9.1
  pdf: ^3.11.3
  printing: ^5.14.2
  crypto: ^3.0.6
  mobile_scanner: ^7.4.0
  http: ^1.6.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/legal_metrology_login_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/legal_metrology_login_icon.png"
  min_sdk_android: 21